<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact Form</title>
</head> 

<body>



<div id="header"> 
<h1>FormCalc Interactive</h1>

<span> Seamless connection meets instant calculation. </span><br><br>
</div>




<div id="contactform">
<h2>Contact Form</h2>

<form action="">

NAME: <input type="text" name="name"><br><br>
EMAIL: <input type="email" name="useremail"><br><br>
DATE: <input type="date" name="date"><br><br>
USER SATISFACTION LEVEL: <input type="range" min="1" max="10" name="range" step="1" value="1" ><br> <br>
<input type="submit" value="SUBMIT"><br><br>

</form>
</div>




<div id="calculator"> <h2>Inline Calculator</h2> 

<form action="" oninput="z.value=parseInt(x.value)+parseInt(y.value)">

1ST NUMBER: <input type="text" id="x" name="num1" placeholder="Enter first number here." value="0"><br><br>
2ST NUMBER: <input type="text" id="y" name="num2" placeholder="Enter second number here." value="0"><br><br>

SUM: <output name="z" for="x y">0</output><br><br><br><br><br>

</form>
</div>




<div id="footer">

</div>

</html>
